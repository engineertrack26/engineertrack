# Runs the three gates on every push and pull request: types, tests, lint.
# No secrets needed — jest and tsc never touch Supabase.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npx jest --silent --ci
      - name: Lint
        run: npx eslint . --max-warnings=100
